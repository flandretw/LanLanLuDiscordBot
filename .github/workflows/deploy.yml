name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy LanLanLu Bot
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code and Restart Container
        run: |
          cd /opt/LanLanLuDiscordBot
          echo "📥 正在從 GitHub 拉取最新程式碼..."
          git pull origin main
          echo "🐳 正在重新建置並啟動容器..."
          docker compose up -d --build
          echo "🧹 清理未使用的虛懸映像檔..."
          docker image prune -f
          echo "✅ 攔藍錄部署完成！🚀"
